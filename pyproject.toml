[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "covalent-pocket-mapper"
version = "0.1.0"
description = "Infer covalent binding pockets from scaffold pulldown mass spectrometry"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = [
    "biopython>=1.79",
    "numpy>=1.21",
    "pandas>=1.3",
    "plotly>=5.0",
    "requests>=2.25",
    "scipy>=1.7",
]

[project.scripts]
covalent-pocket-mapper = "covalent_pocket_mapper.cli:main"

[tool.setuptools]
packages = ["covalent_pocket_mapper"]
