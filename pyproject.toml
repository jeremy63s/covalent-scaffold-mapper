[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "scaffold-binding"
version = "0.1.0"
description = "Infer covalent binding pockets from scaffold pulldown mass spectrometry"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "biopython>=1.79",
    "numpy>=1.21",
    "pandas>=1.3",
    "plotly>=5.0",
    "requests>=2.25",
    "scipy>=1.7",
]

[project.scripts]
scaffold-binding = "scaffold_binding.cli:main"

[tool.setuptools]
packages = ["scaffold_binding"]

license = "MIT"
license-files = ["LICENSE"]
